name: Deploy corporate website to production

# Deploys on every push to main (the production branch), or by hand after the site is rebuilt:
#   gh workflow run deploy-production.yml --repo tangent-atlas/TangentAtlas.Web
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Required for OIDC login (azure/login) - lets GitHub mint a short-lived
# token this workflow exchanges for an Azure access token. No client secret
# is ever stored in GitHub.
permissions:
  id-token: write
  contents: read

# One deploy at a time: App Service refuses a package while another is going in (409 Conflict), as when two pull
# requests are merged a minute apart.  A later push waits for the one in progress rather than cancelling it; if several
# are waiting, only the newest runs, since it carries everything before it.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04

    # Matches the federated credential on the Azure side (identity
    # id-website-deploy-prod, made by TangentAtlas.Platform's
    # Deploy-ManagedIdentities.ps1, which also sets the three AZURE_* variables
    # in this repository's 'production' environment).
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # --------------------------------------------------------------------
      # The solution lives at the repo root; the web project is under src/.
      # restore/build operate on the solution; publish targets the web project
      # specifically (publishing a solution is ambiguous and fails).
      # --------------------------------------------------------------------
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      # xUnit v3 on Microsoft Testing Platform (global.json selects it for dotnet test).
      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Publish
        run: dotnet publish ./src/TangentAtlas.Web/TangentAtlas.Web.csproj --configuration Release --no-restore --output ./publish -p:SourceRevisionId=${{ github.sha }}

      # The logos (github.com/nvstly/icons) are third-party pictures, not part of this repository: the release copies them
      # into the site's pictures folder, which the site finds by itself (TangentAtlas.Web's PictureLibrary).
      - name: Logos
        run: |
          git clone --depth 1 --quiet https://github.com/nvstly/icons.git "$RUNNER_TEMP/icons"
          echo "Icon set at $(git -C "$RUNNER_TEMP/icons" rev-parse --short HEAD)"
          mkdir -p ./publish/pictures
          cp -r "$RUNNER_TEMP/icons/ticker_icons" "$RUNNER_TEMP/icons/forex_icons" "$RUNNER_TEMP/icons/crypto_icons" ./publish/pictures/

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # The site runs on a Linux App Service plan (B1, or Free while parked):
      # TangentAtlas.Platform's Deploy-CorporateWebsite.ps1 and Set-WebsiteTier.ps1.
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: app-tangentatlas-website-prod
          package: ./publish

      # The deploy is done when the new build is the one answering, with its pages and its stylesheet: App Service has been
      # seen to keep the old process running on the new files, which fails every request for a file whose size changed.
      # (The site runs from its package, WEBSITE_RUN_FROM_PACKAGE=1, set by Deploy-CorporateWebsite.ps1, so the files and
      # the process change together.)
      - name: Wait for the new site
        run: |
          SITE=https://app-tangentatlas-website-prod.azurewebsites.net
          for attempt in $(seq 1 60); do
            RUNNING=$(curl --silent --max-time 10 "$SITE/version" || true)
            if [ "$RUNNING" = "${{ github.sha }}" ]; then
              HOME_PAGE=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 20 "$SITE/")
              STYLESHEET=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 20 "$SITE/app.css")
              if [ "$HOME_PAGE" = 200 ] && [ "$STYLESHEET" = 200 ]; then
                echo "$SITE is running ${{ github.sha }}, and its home page and stylesheet answer."
                exit 0
              fi
              echo "::error::The new build is running but the home page answers $HOME_PAGE and the stylesheet $STYLESHEET."
              exit 1
            fi
            echo "Waiting: $SITE/version answers '${RUNNING:-nothing}'..."
            sleep 10
          done
          echo "::error::The new build did not start within ten minutes. Its logs: portal, app-tangentatlas-website-prod, Log stream."
          exit 1
